<script>
(function(){
  "use strict";

  var POSTS = {
    "axiom-mcp-dashboard": {
      title: "Building Production Dashboards with the Axiom MCP Server",
      category: "observability",
      date: "July 1, 2026",
      tags: ["observability", "mcp", "axiom", "dashboards"],
      html:
        '<p>Staring at raw trace data in a query editor is not "observability." It\'s just a different kind of log file.</p>' +
        '<p>I needed dashboards. I didn\'t want to spend a day clicking through a UI to build them — so I used the Axiom MCP server directly inside my coding environment instead.</p>' +
        '<p>MCP lets you connect a service\'s API as tools the AI can call natively. I described what I wanted, it wrote the APL queries, built the chart specs, and called <code>createDashboard</code> directly. I reviewed the JSON, asked for tweaks, it patched. No context switching, no copy-pasting query strings.</p>' +
        '<p>Ended up with two dashboards in prod:</p>' +
        '<ul><li>Error rates across all 4 services, filterable by service and operation, refreshing every 60s</li>' +
        '<li>p50/p95/p99 per service per operation, last 24 hours rolling</li></ul>' +
        '<p>The latency one took 3 iterations — v1 had wrong time bucketing, v2 broke on empty datasets, v3.1 works. Each iteration was a conversation, not a rebuild.</p>' +
        '<p>The thing that surprised me: I started asking for dashboards I wouldn\'t have bothered building manually. "Show me which service is the biggest contributor to tail latency." "Flag any operation where p99 &gt; 2x p95." Queries that would\'ve taken 30 minutes to figure out in APL, I was getting in seconds.</p>' +
        '<p>But the real unlock isn\'t speed. It\'s that the bar for "is this worth building?" dropped enough that I actually built the thing.</p>' +
        '<p>If you\'re running OpenTelemetry and sending data to Axiom, the MCP server takes about 5 minutes to set up.</p>'
    },
    "otel-orphaned-spans": {
      title: "When Your Traces Are Lying: Debugging Orphaned Spans in an Async Pipeline",
      category: "observability",
      date: "July 28, 2026",
      tags: ["opentelemetry", "observability", "python", "distributed-tracing", "backend"],
      html:
        '<p>We had traces flowing across our entire WhatsApp AI platform. Complete coverage — every service instrumented.</p>' +
        '<p>The traces were lying.</p>' +
        '<p>I opened Axiom expecting clean trace trees — connected spans, full journeys. Instead: fragments. Spans with no parent. Traces that started somewhere and went nowhere. The system was working. The data wasn\'t.</p>' +
        '<p>The culprit was async context. Our agent pipeline runs on LangGraph — async, graph-based. Python\'s OTel SDK stores the active span in a <code>ContextVar</code>. When you spawn a coroutine or async task, that context doesn\'t carry over automatically. Nobody was passing it anywhere. Every async handoff was silently cutting the trace tree.</p>' +
        '<p>To find the exact boundaries, I queried Axiom for spans with no parent that also weren\'t root spans. It gave me a clean list: node transitions in the agent graph, worker task spawns, async telephony calls. Each one a context black hole.</p>' +
        '<p>The fix was explicit. At every async boundary, I captured the OTel context and re-attached it inside the new coroutine. For LangGraph, I passed trace context through the graph state so it survived node transitions.</p>' +
        '<p>After that — complete trace trees. WhatsApp message → agent decision → DB write → call initiation. One trace, full journey.</p>' +
        '<p>The real lesson: orphaned spans aren\'t just a tracing bug. They\'re the codebase telling you that async boundaries aren\'t being taken seriously. Fixing the traces fixed that too.</p>'
    },
    "security-agent-1": {
      title: "Building My AI Security Agent — Part 1: The Idea",
      category: "security-agent",
      date: "July 30, 2026",
      tags: ["security-engineering", "ai", "compliance", "sre", "building-in-public"],
      html:
        '<p>My company went through a compliance audit recently.</p>' +
        '<p>The pattern was familiar: prepare, auditor arrives, issues get found, you scramble to fix them before the report goes out. The finding always comes from outside — someone else discovers the gap in your security posture, on their timeline, not yours.</p>' +
        '<p>That bothered me.</p>' +
        '<p>So I started building something: an AI agent that finds the same class of issues an auditor would — before they show up in someone else\'s report.</p>' +
        '<p>Not a checklist tool. Not a vulnerability scanner that outputs a PDF nobody reads.</p>' +
        '<p>Something that scopes a target, attacks it the way a real adversary would, and maps whatever it finds back to the actual compliance controls an auditor would be checking — PCI DSS, SOC2, ISO 27001, GDPR, HIPAA.</p>' +
        '<p>The idea is simple: your audit findings should never surprise you.</p>' +
        '<p>Very early right now. I\'ve got the first version running — an agent that operates autonomously, asks for scope before it touches anything, and reports back into Slack. No dashboard yet, just the skeleton doing real work.</p>' +
        '<p>Going to be building this in public over the coming weeks.</p>'
    },
    "axiom-monitors-mcp": {
      title: "Axiom Monitors MCP: Filling a Gap in the Official MCP Server",
      category: "open-source",
      date: "August 4, 2026",
      tags: ["mcp", "open-source", "devops", "axiom"],
      html:
        '<p>Spent half my day building something I genuinely thought already existed.</p>' +
        '<p>I wanted Cursor to create Axiom monitors right from chat — "create a Slack alert for 5xx errors above 1% on prod" and have the agent just ship it.</p>' +
        '<p>Axiom has an MCP server. I plugged it in and asked the agent to create a monitor.</p>' +
        '<p>The agent replied: "I can only read monitors, not create them."</p>' +
        '<p>I checked the docs. The official Axiom MCP exposes <code>getMonitors</code>, <code>createDashboard</code>, even <code>deleteDashboard</code> — but no <code>createMonitor</code>. No <code>createNotifier</code> either. The REST endpoints exist. They just aren\'t wrapped on the MCP layer.</p>' +
        '<p>I spent an hour assuming it was a token permission issue — bumped the scopes, restarted everything, same result. Then it clicked: the MCP server\'s source code literally doesn\'t expose those tools. No token permission can call a function that doesn\'t exist on the server.</p>' +
        '<p>So I built one.</p>' +
        '<p><b>axiom-monitors-mcp</b> — a Python MCP server wrapping the missing endpoints:</p>' +
        '<ul>' +
        '<li><code>create_slack_notifier</code>, <code>create_email_notifier</code>, <code>create_pagerduty_notifier</code></li>' +
        '<li><code>create_threshold_monitor</code>, <code>create_match_monitor</code>, <code>create_anomaly_monitor</code></li>' +
        '<li>Full list / get / update / delete / enable / disable for both monitors and notifiers</li>' +
        '</ul>' +
        '<p>15 tools total. One-line uvx config for Cursor or Claude Desktop.</p>' +
        '<p>Now I can say "create a monitor that fires when prod 5xx rate goes above 1% over 5 min, route to Slack" and the agent writes the APL, picks the notifier, and ships it.</p>' +
        '<p>The MCP ecosystem is still early. Most of the value right now is in filling gaps where vendors haven\'t shipped tools yet.</p>'
    }
  };

  var openTabs = [];
  var activeId = null;

  var tabBar = document.getElementById('tabBar');
  var editorPane = document.getElementById('editorPane');

  function renderTabs(){
    tabBar.innerHTML = '';
    openTabs.forEach(function(id){
      var post = POSTS[id];
      var tab = document.createElement('div');
      tab.className = 'tab' + (id === activeId ? ' active' : '');
      tab.setAttribute('data-tab', id);

      var label = document.createElement('span');
      label.textContent = id + '.md';
      tab.appendChild(label);

      var closeBtn = document.createElement('span');
      closeBtn.className = 'tab-close';
      closeBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>';
      closeBtn.addEventListener('click', function(e){
        e.stopPropagation();
        closeTab(id);
      });
      tab.appendChild(closeBtn);

      tab.addEventListener('click', function(){ setActive(id); });
      tabBar.appendChild(tab);
    });
  }

  function renderPost(id){
    var post = POSTS[id];
    if(!post){
      editorPane.innerHTML = '<div class="empty-state"><span class="es-glyph">❯</span><span>Select a post from the sidebar to open it.</span></div>';
      return;
    }
    editorPane.innerHTML =
      '<article class="post">' +
        '<div class="post-meta"><span class="pm-cat">' + post.category + '</span><span>' + post.date + '</span></div>' +
        '<h1>' + post.title + '</h1>' +
        post.html +
      '</article>';
    editorPane.scrollTop = 0;
  }

  function setActive(id){
    activeId = id;
    renderTabs();
    renderPost(id);
    document.querySelectorAll('.tree-file').forEach(function(el){
      el.classList.toggle('active', el.getAttribute('data-post') === id);
    });
    if(window.innerWidth <= 900){ closeSidebar(); }
  }

  function openTab(id){
    if(openTabs.indexOf(id) === -1){ openTabs.push(id); }
    setActive(id);
  }

  function closeTab(id){
    var idx = openTabs.indexOf(id);
    if(idx === -1){ return; }
    openTabs.splice(idx, 1);
    if(activeId === id){
      var next = openTabs[idx] || openTabs[idx - 1] || null;
      if(next){ setActive(next); }
      else{ activeId = null; renderTabs(); renderPost(null); document.querySelectorAll('.tree-file').forEach(function(el){ el.classList.remove('active'); }); }
    } else {
      renderTabs();
    }
  }

  document.querySelectorAll('.tree-file').forEach(function(el){
    el.addEventListener('click', function(){
      openTab(el.getAttribute('data-post'));
    });
  });

  // ---- mobile sidebar toggle ----
  var sidebar = document.getElementById('sidebar');
  var sidebarToggle = document.getElementById('sidebarToggle');
  function closeSidebar(){ sidebar.classList.remove('open'); }
  sidebarToggle.addEventListener('click', function(){
    sidebar.classList.toggle('open');
    document.body.classList.toggle('sidebar-collapsed');
  });

  // open the most recent post by default
  openTab('axiom-monitors-mcp');
})();
</script>

</body>
</html>
